name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Regenera las páginas con la URL pública real (canonical, sitemap, robots)
      - name: Generar sitio
        run: SITE_URL="${{ steps.pages.outputs.base_url }}" node scripts/build.mjs

      - name: Preparar carpeta pública
        run: |
          mkdir _site
          cp -r index.html blog style.css script.js favicon.svg robots.txt sitemap.xml _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
